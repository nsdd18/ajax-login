<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户登录</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f7fa;
        }

        .login-box {
            max-width: 400px;
            margin: 90px auto;
            background: #fff;
            padding: 32px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .08);
        }

        .login-box h1 {
            font-size: 22px;
            text-align: center;
            margin-bottom: 24px;
            color: #1e88e5;
        }

        .tip {
            font-size: 12px;
            color: #90a4ae;
            text-align: center;
            margin-top: 14px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1>用户登录</h1>

    <!-- novalidate：关闭浏览器默认提示，统一用 Bootstrap 的校验样式 -->
    <form id="loginForm" novalidate>

        <div class="mb-3">
            <label class="form-label" for="username">用户名</label>
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="请输入用户名" required>
            <div class="invalid-feedback">请输入用户名</div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="password">密码</label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="请输入密码" required>
            <div class="invalid-feedback">请输入密码</div>
        </div>

        <button class="btn btn-primary w-100" type="submit" id="submitBtn">登 录</button>

        <!-- 服务器返回的提示信息显示在这里 -->
        <div id="msg" class="alert mt-3 mb-0 d-none" role="alert"></div>
    </form>

    <p class="tip">测试账号：admin / 123456　　user / 123456</p>
</div>

<script src="js/app.js"></script>
</body>
</html>
